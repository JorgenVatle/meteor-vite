# Base deployment manifest
# Use `$ envsubst` to populate fields in the manifest before applying it.
#
# Example environment variables:
# APP_NAME="vue3"
# APP_IMAGE="example.vue3.meteor-vite:latest"
# APP_VERSION="sha-abc123" # (optional)
#
# Example usage:
# $ cat .kubernetes/deployments/meteor.yml | envsubst | kubectl apply -f -
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "${DEPLOYMENT_NAME}"
  labels:
    app.kubernetes.io/component: meteor
    app.kubernetes.io/part-of: meteor-vite-example-apps
    app.kubernetes.io/meteor-version: "${METEOR_RELEASE}"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: meteor
      app.kubernetes.io/part-of: meteor-vite-example-apps
  template:
    metadata:
      labels:
        app.kubernetes.io/component: meteor
        app.kubernetes.io/part-of: meteor-vite-example-apps
        app.kubernetes.io/meteor-version: "${METEOR_RELEASE}"
    spec:
      containers:
        - name: meteor
          image: "${APP_IMAGE}"
          ports:
            - containerPort: 3000
              name: meteor
          env:
            - name: PORT
              value: "${PORT}"
            - name: ROOT_URL
              value: "${ROOT_URL}"
            - name: DEBUG
              value: html-boilerplate:*
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: meteor
                  key: mongoConnectionUri
            - name: MONGO_OPLOG_URL
              valueFrom:
                secretKeyRef:
                  name: meteor
                  key: mongoOplogConnectionUri
          resources:
            requests:
              cpu: 50m
              memory: 75Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            failureThreshold: 10
            periodSeconds: 5
            httpGet:
              port: 3000
              path: "${BASE_PATH}"


---
apiVersion: v1
kind: Service
metadata:
  name: "${DEPLOYMENT_NAME}"
  labels:
    app.kubernetes.io/component: meteor
    app.kubernetes.io/part-of: meteor-vite-example-apps
spec:
  type: ClusterIP
  ports:
    - port: "${PORT}"
      name: meteor
  selector:
    app.kubernetes.io/component: meteor
    app.kubernetes.io/part-of: meteor-vite-example-apps

