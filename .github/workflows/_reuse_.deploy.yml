name: 'Deploy Preview'
run-name: '🚀 Deploy: ${{ inputs.appBasename }}'
on:
  workflow_call:
    inputs:
      appBasename:
        type: string
        description: |
          Basename for the directory containing the example app being deployed.
          Can only contain lowercase alphanumeric characters, `-` and `_`.
          Example: vue, react, vue-meteor-v3
        required: true
      imageRegistry:
        type: string
        default: ghcr.io
      meteorBaseImage:
        type: string
        required: false
        description: |
          Meteor base image for bundling. Useful to override if you need a Meteor release not officially
          supported yet by the original geoffreybooth image.
      nodeVersion:
        type: string
        required: false
        description: Node.js Docker image version to use for the final production build.
      viteBaseUrl:
        type: string
        required: false
      viteAssetDir:
        type: string
        required: false
      eventName:
        type: string
        required: false
        description: Name of the event that triggered this workflow

env:
  APP_NAME: ${{ inputs.appBasename }}
  APP_NAMESPACE: meteor-vite
  REMOVE_AFTER: ${{ (inputs.eventName == 'pull_request' && '1m') || 'never'  }}
jobs:
  build:
    name: Build 🐋
    uses: ./.github/workflows/_reuse_.build.yml
    secrets: inherit
    with:
      appBasename: ${{ inputs.appBasename }}
      nodeVersion: ${{ inputs.nodeVersion }}
      meteorBaseImage: ${{ inputs.meteorBaseImage }}
      viteBaseUrl: ${{ inputs.viteBaseUrl }}
      viteAssetDir: ${{ inputs.viteAssetDir }}
      push: true

  deploy:
    name: Deploy 🚀
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.appBasename }}
    environment:
      name: ${{ inputs.appBasename }}/${{ github.ref_name }}
      url: ${{ env.ROOT_URL }}
    env:
      APP_VERSION: ${{ needs.build.outputs.imageVersion }}
      APP_IMAGE: ${{ needs.build.outputs.deploymentImage }}
      METEOR_VERSION: ${{ needs.build.outputs.meteorRelease }}
      ROOT_URL: https://meteor-vite-preview.wcaserver.com/${{ needs.build.outputs.basePath }}
      BASE_PATH: ${{ needs.build.outputs.basePath }}
      DEPLOYMENT_NAME: ${{ inputs.appBasename }}-${{ needs.build.outputs.refTag }}
      METEOR_RELEASE: ${{ needs.build.outputs.meteorRelease }}
      GIT_REF: ${{ needs.build.outputs.refTag }}
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup kubectl
        # language="bash"
        run: |
          mkdir -p ~/.kube
          echo '${{ secrets.KUBE_CONFIG_DATA }}' | base64 -d > ~/.kube/config

      - name: Install dependencies
        run: npm ci

      - name: Apply manifest
        # language="bash"
        run: toolkit kube-deploy -f .kubernetes/deployments/meteor.yml

      - name: Verify deployment
        # language="bash"
        run: |
          kubectl rollout status deployment --watch --timeout 30s -n "$APP_NAMESPACE" "$DEPLOYMENT_NAME"

      - name: Update preview ingress
        # language="bash"
        run: toolkit kube-sync-ingress --ingress preview