name: 'Reusable: Build'
on:
  workflow_call:
    inputs:
      appBasename:
        required: true
        type: string
      meteorRelease:
        type: string
        required: false
      nodeVersion:
        type: string
        required: false
      push:
        type: boolean
        default: false
      imageRegistry:
        type: string
        default: ghcr.io
      meteorBaseImage:
        type: string
        required: false
    outputs:
      deploymentImage:
        value: ${{ jobs.docker.outputs.deploymentImage }}
      imageVersion:
        value: ${{ jobs.docker.outputs.imageVersion }}
      meteorRelease:
        value: ${{ jobs.docker.outputs.meteorRelease }}

env:
  APP_NAME: meteor-v2-${{ inputs.appBasename }}

jobs:
  ubuntu:
    name: 'Ubuntu 🐧'
    runs-on: ubuntu-latest
    if: inputs.push != true
    timeout-minutes: 10
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v3

      - name: 'Setup Node (for building meteor-vite with modern tooling)'
        uses: actions/setup-node@v4
        with:
            node-version: 22

      - name: 'Setup Meteor'
        uses: meteorengineer/setup-meteor@v1
        with:
          meteor-release: ${{ inputs.meteorRelease || '2.16' }}

      - name: 'Install dependencies'
        run: npm i

      - name: 'Install and link dependencies for `examples/${{ inputs.appBasename }}`'
        run: meteor npm run example prepare ${{ inputs.appBasename }}

      - name: 'Link meteor-vite package'
        run: meteor npm run link ${{ inputs.appBasename }}

      - name: 'Build for production'
        run: meteor npm run build ${{ inputs.appBasename }}

  docker:
    runs-on: ubuntu-latest
    name: Docker 🐋
    outputs:
      deploymentImage: ${{ steps.image.outputs.deploymentImage }}
      imageVersion: ${{ steps.image.outputs.imageVersion }}
      meteorRelease: ${{ steps.image.outputs.meteorRelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Format image name
        id: image
        # language="bashpro shell script"
        run: |
          meteorRelease="$(cat 'examples/${{ inputs.appBasename }}/.meteor/release' | cut -d '@' -f 2)"
          imageName="${{ inputs.imageRegistry }}/${{ github.repository_owner }}/meteor-vite/example/${{ env.APP_NAME }}"
          imageName="$(echo $imageName | tr '[:upper:]' '[:lower:]')"
          imageVersion="sha-${GITHUB_SHA:0:7}"

          echo "cacheTag=$imageName:buildcache" >> $GITHUB_OUTPUT
          echo "deploymentImage=$imageName:$imageVersion" >> $GITHUB_OUTPUT

          echo "imageName=$imageName" >> $GITHUB_OUTPUT
          echo "imageVersion=$imageVersion" >> $GITHUB_OUTPUT
          echo "meteorRelease=$meteorRelease" >> $GITHUB_OUTPUT

      - name: Prepare metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ steps.image.outputs.imageName }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ${{ inputs.push && 'Build & Push' || 'Build' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.image.outputs.deploymentImage }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.cacheTag }}
          cache-to: type=registry,ref=${{ steps.image.outputs.cacheTag }},mode=max
          build-args: |
            ${{ steps.image.outputs.meteorRelease   &&   format('METEOR_RELEASE={0}', steps.image.outputs.meteorRelease) }}
            ${{ inputs.meteorBaseImage              &&   format('METEOR_BASE_IMAGE={0}', inputs.meteorBaseImage)         }}
            ${{ inputs.nodeVersion                  &&   format('NODE_VERSION={0}', inputs.nodeVersion)                  }}
            APP_BASENAME=${{ inputs.appBasename }}
            
